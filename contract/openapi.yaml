openapi: 3.0.3

info:
  title: Counthouse API
  version: "1"
  description: |
    The contract of the Counthouse API. The API implements interfaces generated
    from this file, and its clients generate their types from it.

    ## Conventions

    **Tenancy.** Operations for signed-in staff take the tenant from the access
    token. No path, query or body field carries a tenant id.

    **Ids.** UUIDs. Clients treat them as opaque.

    **Naming.** Collections are plural, and path segments are kebab-case. `/me`
    is the signed-in user. Properties and query parameters are camelCase. Enum
    values are UPPER_SNAKE_CASE, except codes defined elsewhere, such as
    language tags. Operation ids are a verb and a noun, such as `getMe`.

    **Versioning.** No version in the URL. `info.version` is not used.

    **Errors.** Every error is a problem details object (RFC 9457) sent as
    `application/problem+json`, and every operation lists it as its `default`
    response. A problem with no meaning beyond its HTTP status has no `type`,
    which RFC 9457 reads as `about:blank`, and the status phrase as its title.
    Clients act on `status` and `type`; `detail` is for people.

tags:
  - name: Me
    description: The signed-in user and their tenant.

security:
  - bearerAuth: []

paths:
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user and their tenant
      responses:
        "200":
          description: The signed-in user and their tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: A problem details object (RFC 9457).
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem. Absent means `about:blank`.
        title:
          type: string
          description: A short summary of the kind of problem, in English.
          example: Not Found
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: An explanation of this occurrence, in English.

    Me:
      type: object
      required: [user, tenant]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"

    User:
      type: object
      required: [id, role]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"

    Role:
      type: string
      enum: [STAFF, ADMIN]

    Tenant:
      type: object
      required: [id, name, timeZone, locale]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timeZone:
          type: string
          description: IANA time zone.
          example: America/Montevideo
        locale:
          type: string
          description: |
            Default language of the tenant's staff, a BCP 47 language tag.
            Today `es` or `en`.
          example: es
