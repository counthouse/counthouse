version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: build(api)
    cooldown:
      default-days: 7
    groups:
      maven:
        update-types: [minor, patch]
        # A Spotless update can change the formatter and reformat code, and an
        # openapi-generator update can change the generated code, so each comes
        # in its own pull request instead of failing the whole group.
        exclude-patterns: ["*spotless*", "*openapi-generator*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    cooldown:
      default-days: 7
