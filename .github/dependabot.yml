version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    commit-message:
      prefix: build(api)
    cooldown:
      default-days: 7
    groups:
      maven:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
