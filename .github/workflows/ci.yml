name: CI

on:
  pull_request:
    # `edited` catches a base branch change; never skip jobs for this event.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The workflow runs on every change, so required checks always report.
  # A job skipped by its `if:` reports success; a workflow skipped by a
  # path filter would leave its required checks pending forever.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both sides of a move, so a file moved out of a watched path counts.
          changed=$(git diff --name-only --no-renames "$BASE...$HEAD")
          echo "$changed"
          # The API jobs are skipped only when every changed file is known not
          # to affect the API: a file the API reads anywhere else still runs them.
          if echo "$changed" | grep -qvE '^(apps/site/|docs/|[^/]+\.md$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          # The site's dependencies are in the root package files.
          if echo "$changed" | grep -qE '^(apps/site/|\.github/|package\.json$|package-lock\.json$|\.nvmrc$)'; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/
          retention-days: 7

  # Applies the base's migrations (the previous main commit on a push), then
  # this commit's, so Flyway validates the existing history: a changed,
  # renamed, deleted, duplicate, out-of-order or misnamed migration fails. The
  # rules are set on the command line, which overrides any Flyway
  # configuration the branch adds.
  migrations:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A step, not a service: a service image can only come from the workflow
      # text or an expression, and zizmor flags an expression as unpinned.
      # pg_isready over TCP skips the entrypoint's socket-only init server.
      - name: Start PostgreSQL
        run: |
          image=$(sed -n 's/^FROM //p' ../../infra/images/postgres.Dockerfile)
          docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=counthouse \
            -p 5432:5432 "$image"
          timeout 60 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q; do sleep 1; done'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      # Its own cache: setup-java keys the Maven cache on the pom alone, so this
      # job would share the api job's entry, whose copy on main is saved by api
      # and lacks the Flyway plugin. This job also runs on pushes to main, so
      # pull requests restore a complete entry from the default branch. No
      # restore key, like setup-java: a pom change starts from a clean cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-migrations-${{ runner.os }}-${{ hashFiles('apps/api/pom.xml', 'apps/api/.mvn/wrapper/maven-wrapper.properties') }}
      # The same roles as the tests: migrations run as the migrator, which owns
      # the database but is not a superuser.
      - name: Create the database roles
        run: docker exec -i postgres psql -v ON_ERROR_STOP=1 -U postgres -d counthouse < src/test/resources/db/roles.sql
      # Pull requests migrate from their base; pushes to main from the previous
      # main commit.
      - name: Migrate from the base to this commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          migrate() {
            ./mvnw -B -ntp org.flywaydb:flyway-maven-plugin:migrate \
              -Dflyway.url=jdbc:postgresql://localhost:5432/counthouse \
              -Dflyway.user=counthouse_migrator -Dflyway.password=migrator \
              -Dflyway.locations="filesystem:$1" -Dflyway.failOnMissingLocations=true \
              -Dflyway.validateOnMigrate=true -Dflyway.validateMigrationNaming=true \
              -Dflyway.outOfOrder=false -Dflyway.ignoreMigrationPatterns='*:future'
          }
          migrate "$RUNNER_TEMP/base/apps/api/src/main/resources/db/migration"
          migrate src/main/resources/db/migration

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The build needs no install scripts; skipping them keeps dependency
      # code from running in CI.
      - run: npm ci --ignore-scripts
      - run: npm run lint -w apps/site
      - run: npm run typecheck -w apps/site
      - run: npm run test:unit -w apps/site
      - run: npm run build -w apps/site
      - name: Check lang, canonical and hreflang in the built pages
        run: npm run check:i18n -w apps/site
      - name: Check the sitemap and robots.txt
        run: npm run check:search -w apps/site
      # The build passes even when Tailwind does not scan the design system
      # (a wrong `@source` path), so check that one of its classes was
      # generated. `rounded-button` is used only inside the library.
      - name: Check the design system's classes are in the CSS
        run: grep -rqF 'rounded-button' apps/site/out/_next/static --include='*.css'
      # The Chromium build pinned by the lockfile's Playwright; Lighthouse uses it too.
      - run: npm exec -w apps/site -- playwright install --with-deps chromium
      - run: npm run test:a11y -w apps/site
      - run: npm run test:lighthouse -w apps/site
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-reports
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
            apps/site/lighthouse-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan new commits with gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            from="$BASE" to="$HEAD"
          else
            from="$BEFORE" to="$AFTER"
          fi
          # gitleaks reports no leaks for a range it cannot resolve.
          for sha in "$from" "$to"; do
            git rev-parse --verify --quiet "$sha^{commit}" > /dev/null || { echo "Unknown commit $sha"; exit 1; }
          done
          # Only .git is mounted, so allowlists in the checked-out tree are not
          # read; -m scans what merge commits add.
          image=$(sed -n 's/^FROM //p' infra/images/gitleaks.Dockerfile)
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/.git:/repo:ro" "$image" \
            git /repo --log-opts="-m $from..$to" --ignore-gitleaks-allow --redact --verbose --no-banner

  # Prettier formats every file it has a parser for; Java is checked by the
  # `api` job through Spotless. Runs on every change, like `secrets`.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Prettier needs no install scripts; skipping them keeps dependency code
      # from running in CI. The workspaces' dependencies are not needed either.
      - run: npm ci --ignore-scripts --workspaces=false
      - run: npm run format:check

  # Runs the Claude Code hooks in .claude/hooks against temporary git
  # repositories. The hooks give agents early feedback; the jobs above stay
  # the guard. Runs on every change, like `format`.
  agent-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The hooks and their tests use only Node's standard library, so there
      # is nothing to install.
      - run: npm run test:hooks

  # Lints the workflows: actionlint for syntax, expressions and shell
  # scripts, zizmor for security issues, and a check of the image pins.
  # Runs on every change, like `format`: zizmor's online audits can fail on
  # a new advisory without a workflow edit. Each check runs even when an
  # earlier one failed, so one run reports them all.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          image=$(sed -n 's/^FROM //p' infra/images/actionlint.Dockerfile)
          docker run --rm -v "$PWD:/repo:ro" --workdir /repo "$image" -color
      # `latest` is the zizmor version locked in this action release, so
      # Dependabot's update of the action also updates zizmor.
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        if: ${{ !cancelled() }}
        with:
          version: latest
          persona: regular
          min-severity: low
          min-confidence: low
          advanced-security: false
          annotations: true
      # Each image is pinned in one file under infra/images, which Dependabot
      # updates and PinnedImage.java reads. `if`, not `!`: a `!` command
      # never fails a step under `bash -e`.
      - name: Check the image pins
        if: ${{ !cancelled() }}
        run: |
          status=0
          for f in infra/images/*.Dockerfile; do
            # grep -c also counts a last line without a newline; wc -l does not.
            if [ "$(wc -l < "$f")" -ne 1 ] || [ "$(grep -c '' "$f")" -ne 1 ] ||
              ! grep -qxE 'FROM [a-z0-9./_-]+:[A-Za-z0-9_][A-Za-z0-9_.-]*@sha256:[0-9a-f]{64}' "$f"; then
              echo "$f: not one line FROM <image>:<tag>@sha256:<digest>"
              status=1
              continue
            fi
            ref=$(sed 's/^FROM \(.*\)@sha256:.*/\1/' "$f")
            if git grep -nF -e "$ref" -- . ':!infra/images'; then
              echo "$ref is pinned outside infra/images"
              status=1
            fi
          done
          if git grep -nE '@sha256:[0-9a-f]{64}' -- . ':!infra/images'; then
            echo "A digest outside infra/images"
            status=1
          fi
          exit "$status"

  # The only required check: it fails when any job failed or was cancelled,
  # and passes when jobs succeeded or were skipped as not affected. New jobs
  # are added to `needs` here, not to the branch ruleset.
  ci-passed:
    if: always()
    needs:
      [changes, api, migrations, site, secrets, format, agent-hooks, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
